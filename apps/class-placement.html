<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>반배정 도구 | 초록덕후의 교실 도구함</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
  @font-face { font-family:'NanumSquareRound'; font-weight:800; font-style:normal; font-display:swap; src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_11-01@1.0/NanumSquareRoundEB.woff2') format('woff2'); }
  :root { --green:#15803d; --deep:#14532d; --mist:#f0fdf4; --line:#e3e8e1; --ink:#17201a; --muted:#66736a; --body:#27352b; --font-body:'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',system-ui,sans-serif; --font-display:'NanumSquareRound','Pretendard',sans-serif; }
  *{box-sizing:border-box} body{margin:0;font-family:var(--font-body);color:var(--body);line-height:1.75;word-break:keep-all;background:linear-gradient(180deg,#fff,var(--mist),#fff)}
  .wrap{width:min(920px,calc(100% - 40px));margin:0 auto} header{border-bottom:1px solid var(--line);background:rgba(255,255,255,.82);backdrop-filter:blur(16px);position:sticky;top:0} .nav{height:64px;display:flex;align-items:center;justify-content:space-between} a{color:inherit;text-decoration:none}.brand{font-family:var(--font-display);font-weight:800;color:var(--deep)} .back{font-weight:700;color:var(--green);font-size:14px}
  main{padding:72px 0} .badge{display:inline-flex;padding:7px 12px;border-radius:999px;background:var(--mist);border:1px solid #bbf7d0;color:var(--deep);font-size:13px;font-weight:800} h1{font-family:var(--font-display);font-size:clamp(38px,6vw,60px);line-height:1.12;letter-spacing:-.05em;color:var(--ink);margin:22px 0 16px} .lead{font-size:20px;color:#3a463d;margin:0 0 34px;max-width:720px}.panel{background:#fff;border:1px solid var(--line);border-radius:28px;padding:30px;margin:18px 0;box-shadow:0 18px 45px rgba(16,36,24,.07)} h2{font-family:var(--font-display);color:var(--ink);margin:0 0 14px;font-size:26px}.list{padding:0;list-style:none;display:grid;gap:10px}.list li{display:flex;gap:10px}.list li:before{content:'✓';color:var(--green);font-weight:900}.placeholder{height:260px;border-radius:22px;background:linear-gradient(135deg,var(--mist),#fff);border:1px dashed #86efac;display:grid;place-items:center;color:var(--muted);font-weight:700} footer{padding:40px 0;color:var(--muted)}
</style>
</head>
<body>
<header><div class="wrap nav"><a class="brand" href="../index.html">🌿 초록덕후의 교실 도구함</a><a class="back" href="../index.html#apps">← 도구함으로</a></div></header>
<main><div class="wrap">
<span class="badge">🏫 도구 상세</span>
<h1>반배정 도구</h1>
<p class="lead">조건을 보며 반배정 기준을 정리합니다.</p>
<div class="panel"><h2>무엇을 하나요?</h2><ul class="list"><li>학교 업무</li><li>민감정보 주의</li><li>사용 방법 정리 예정</li></ul></div>
<div class="panel"><h2>화면 미리보기</h2><div class="placeholder">스크린샷 추가 예정</div></div>
<div class="panel"><h2>사용 안내</h2><p>앱 링크, 사용 방법, 서버 연결 여부를 이곳에 정리할 예정입니다.</p></div>
</div></main>
<footer><div class="wrap">선생님들의 편안한 학교생활을 응원합니다</div></footer>
</body>
</html>
